# Remote theme directory
remote_theme: analytics-link/analytics-link.github.io

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme

#-------------------------------
# General Site Settings
title: Sab Strong
description: "Hi, I’m Sabrina, better known as Sab. I’m a senior technical specialist bridging complex data validation, systems analysis, and modern analytics. My portfolio focuses on interesting projects I've recently undertaken, with a strong emphasis on practical problem-solving and technical depth. Please feel free to explore my GitHub and LinkedIn pages, or download my resume using the links below!"
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com

#-------------------------------
# About Section
subtitle: Data Science <span style="color:#f58506"> Portfolio </span>
location: "Kitchener, ON"
resume_url: /docs/Sab_Strong_Resume.pdf
avatar_image: /img/profile_picture.jpg

#-------------------------------
# Contact links
linkedln: "https://linkedln.com/in/sabrina-sab-strong/" # Add your linkedln handle
github: "https://github.com/strongincanada"  # Add your github handle

paginate: 6
paginate_path: "/page/:num"

sass:
  sass_dir: _sass
  style: compressed # possible values: nested expanded compact compressed

defaults:
  - scope:
      type: posts
    values:
      layout: post
      read_time: true
      share: false


